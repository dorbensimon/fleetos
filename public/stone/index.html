<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f3f2ef">
<title>מסגרת לאבן</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/stone/stone.jpg" as="image">
<style>
  :root {
    --bg: #f3f2ef;
    --panel: #ffffff;
    --line: #e4e2dd;
    --field: #f6f5f2;
    --text: #17171a;
    --muted: #6d6c72;
    --accent: #1f1f24;
    --accent-ink: #ffffff;
    --soft: #ecebe7;
    --like: #ff3040;
    --danger: #c62f3b;
    --danger-bg: #fdeced;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(20,18,12,.04), 0 10px 30px rgba(20,18,12,.06);
    --spring: cubic-bezier(.32,.72,0,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --panel: #1a1a1d; --line: #2b2b30; --field: #222226; --text: #f1f0ee;
      --muted: #9c9ba3; --accent: #f1f0ee; --accent-ink: #111113; --soft: #26262b;
      --danger: #ff7a85; --danger-bg: #3a1c20;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, label, .chip { -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  /* ---------- page ---------- */
  header.top { max-width: 1160px; margin: 0 auto; padding: 28px 20px 6px; }
  header.top h1 { margin: 0; font-size: 26px; line-height: 1.15; letter-spacing: -.02em; font-weight: 700; }
  header.top p { margin: 6px 0 0; color: var(--muted); }
  .layout {
    max-width: 1160px; margin: 0 auto; padding: 16px 20px 40px;
    display: grid; gap: 20px; grid-template-columns: 1fr;
  }
  @media (min-width: 920px) {
    .layout { grid-template-columns: 380px 1fr; align-items: start; }
    .preview-col { position: sticky; top: 20px; }
  }
  @media (max-width: 919px) {
    header.top { padding-top: 20px; }
    header.top h1 { font-size: 22px; }
    .preview-col { order: -1; }
    .layout { padding-bottom: calc(110px + env(safe-area-inset-bottom)); gap: 14px; }
  }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px;
  }
  .controls { display: grid; gap: 14px; }
  .card h2 {
    margin: 0 0 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .n {
    width: 22px; height: 22px; border-radius: 50%; background: var(--soft); color: var(--text);
    display: inline-grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stack { display: grid; gap: 12px; }
  input[type=text], input[type=number], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; outline: none; min-height: 46px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus { border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--text) 12%, transparent); }
  input.ltr { direction: ltr; text-align: left; }

  /* image picker */
  .drop {
    display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px;
    border: 1.5px dashed var(--line); background: var(--field); cursor: pointer;
    transition: border-color .15s, background .15s, transform .12s;
  }
  .drop:hover, .drop.over { border-color: var(--text); }
  .drop:active { transform: scale(.985); }
  .drop .thumb {
    width: 58px; height: 58px; border-radius: 12px; flex: none; background: var(--soft) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted);
  }
  .drop b { display: block; font-weight: 600; }
  .drop span { color: var(--muted); font-size: 13px; word-break: break-all; }
  .zoom { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .zoom input { flex: 1; accent-color: var(--text); }
  .link-btn { background: none; border: 0; color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; }

  .avatar-pick { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .avatar-pick .av {
    width: 40px; height: 40px; border-radius: 50%; background: var(--soft) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted); flex: none; border: 1px solid var(--line);
  }
  .avatar-pick u { color: var(--text); font-weight: 600; text-underline-offset: 3px; }

  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--danger-bg); color: var(--danger); }
  .msg.info { background: var(--soft); color: var(--text); }

  /* like toggle */
  .like-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; border-radius: 14px; background: var(--field); border: 1px solid var(--line);
    margin-bottom: 14px; cursor: pointer;
  }
  .like-row .lbl { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .like-row .lbl small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .like-row svg { flex: none; overflow: visible; }
  .like-row svg path { transition: fill .2s, stroke .2s; }
  .like-row.on svg path { fill: var(--like); stroke: var(--like); }
  .like-row.pop svg { animation: pop .45s var(--spring); }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.28); } 100% { transform: scale(1); } }
  .switch {
    position: relative; width: 51px; height: 31px; border-radius: 999px; flex: none;
    background: color-mix(in srgb, var(--muted) 35%, transparent); transition: background .25s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .35s var(--spring);
  }
  .like-row.on .switch { background: var(--like); }
  .like-row.on .switch::after { transform: translateX(-20px); }

  /* sizes */
  .size-main {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font: inherit; color: var(--text); text-align: right; cursor: pointer;
    padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--field);
    transition: border-color .15s, background .15s, transform .12s;
  }
  .size-main:active { transform: scale(.985); }
  .size-main b { display: block; font-size: 16px; }
  .size-main small { display: block; color: var(--muted); font-size: 12px; }
  .size-main .tick {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); flex: none;
    display: grid; place-items: center; transition: background .15s, border-color .15s;
  }
  .size-main[aria-pressed="true"] { border-color: var(--text); background: var(--panel); }
  .size-main[aria-pressed="true"] .tick { background: var(--text); border-color: var(--text); }
  .size-main[aria-pressed="true"] .tick::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--panel); }
  details.more { margin-top: 12px; }
  details.more summary {
    cursor: pointer; list-style: none; font-size: 13px; font-weight: 600; padding: 6px 0;
    display: flex; align-items: center; gap: 6px;
  }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "‹"; display: inline-block; transition: transform .25s var(--spring); }
  details.more[open] summary::before { transform: rotate(-90deg); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
  .chip {
    font: inherit; font-size: 13px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--field); color: var(--text); min-height: 36px;
    transition: background .15s, color .15s, transform .12s;
  }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--panel); }

  /* preview */
  .preview-card { padding: 14px; }
  .seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin-bottom: 14px;
    background: var(--soft); border-radius: 12px;
  }
  .seg .ind {
    position: absolute; top: 3px; bottom: 3px; right: 3px; width: calc(50% - 3px); border-radius: 9px;
    background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.05);
    transition: transform .45s var(--spring);
  }
  .seg[data-v="stone"] .ind { transform: translateX(-100%); }
  .seg button {
    position: relative; z-index: 1; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600;
    color: var(--muted); padding: 9px 8px; border-radius: 9px; cursor: pointer; transition: color .2s;
  }
  .seg button[aria-selected="true"] { color: var(--text); }
  .stage {
    position: relative; display: grid; place-items: center; height: min(70vh, 720px); min-height: 320px;
    border-radius: 14px; overflow: hidden; background: var(--field);
  }
  .stage.stone-bg { background: #ffffff; }
  @media (max-width: 919px) { .stage { height: auto; min-height: 0; aspect-ratio: 1 / 1; } }
  canvas#preview { display: block; max-width: 100%; transition: opacity .18s ease; }
  canvas#preview.design { box-shadow: 0 2px 6px rgba(0,0,0,.10), 0 18px 40px rgba(0,0,0,.12); border-radius: 3px; background: #fff; }
  canvas#preview.can-drag { cursor: grab; touch-action: none; }
  canvas#preview.dragging { cursor: grabbing; }
  canvas#preview.fade { opacity: 0; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; padding: 0 4px; }
  .meta .dims { color: var(--muted); font-size: 13px; }
  .meta .hint { color: var(--muted); font-size: 12px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 12px 22px; min-height: 50px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .12s ease-out, opacity .15s;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:not(:disabled):active { transform: scale(.97); }
  .savebar { display: none; }
  @media (max-width: 919px) {
    .meta .btn { display: none; }
    .savebar {
      display: flex; position: fixed; inset: auto 0 0 0; z-index: 10;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--panel) 78%, transparent);
      -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    }
    .savebar .btn { flex: 1; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translate(-50%, 12px) scale(.98); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    transition: opacity .2s, transform .35s var(--spring); pointer-events: none; z-index: 20; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  @media (min-width: 920px) { .toast { bottom: 28px; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .savebar { background: var(--panel); -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>מסגרת פוסט לאבן</h1>
  <p>מעלים תמונה, ממלאים פרטים, רואים איך זה ייראה על האבן — ושומרים.</p>
</header>

<main class="layout">
  <section class="controls" aria-label="הגדרות">
    <div class="card">
      <h2><span class="n">1</span>תמונה</h2>
      <label class="drop" id="drop">
        <div class="thumb" id="thumb" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        </div>
        <div>
          <b id="dropTitle">בחרו תמונה מהגלריה</b>
          <span id="dropSub">JPG, PNG, HEIC — או גררו לכאן</span>
        </div>
        <input id="file" class="sr" type="file" accept="image/*">
      </label>
      <div class="zoom" id="zoomRow" hidden>
        זום
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="זום">
        <button class="link-btn" id="resetPos" type="button">איפוס</button>
      </div>
      <div class="msg" id="imgMsg" role="alert"></div>
    </div>

    <div class="card">
      <h2><span class="n">2</span>פרטי הפוסט</h2>
      <div class="stack">
        <div class="grid2">
          <label class="f">שם משתמש
            <input id="username" type="text" class="ltr" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="username">
          </label>
          <label class="f">מיקום
            <input id="location" type="text" dir="auto" autocomplete="off" placeholder="New York, NY">
          </label>
        </div>
        <label class="avatar-pick">
          <span class="av" id="avThumb" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
          </span>
          <span><u id="avLabel">הוספת תמונת פרופיל</u> · לא חובה</span>
          <input id="avatarFile" class="sr" type="file" accept="image/*">
        </label>
      </div>
    </div>

    <div class="card">
      <h2><span class="n">3</span>לייקים ותגובות</h2>
      <div class="like-row" id="likeRow" role="switch" tabindex="0" aria-checked="true">
        <span class="lbl">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3s-7.6-4.6-9.4-9.3C1.3 7.6 3.5 4.3 7 4.3c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.5 0 5.7 3.3 4.4 6.7-1.8 4.7-9.4 9.3-9.4 9.3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
          <span>לב אדום<small>כאילו עשיתם לייק לפוסט</small></span>
        </span>
        <span class="switch" aria-hidden="true"></span>
      </div>
      <div class="grid2">
        <label class="f">לייקים <input id="likes" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">תגובות <input id="comments" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">שיתופים <input id="shares" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">שמירות <input id="saves" type="text" inputmode="numeric" class="ltr"></label>
      </div>
    </div>

    <div class="card">
      <h2><span class="n">4</span>גודל</h2>
      <button class="size-main" id="stoneSize" type="button" aria-pressed="true">
        <span><b>גודל אבן</b><small>6×6 ס״מ · 300 DPI</small></span>
        <span class="tick" aria-hidden="true"></span>
      </button>
      <details class="more" id="more">
        <summary>גדלים אחרים</summary>
        <div class="chips" id="presets"></div>
        <div class="grid3">
          <label class="f">רוחב (ס״מ) <input id="wcm" type="number" min="2" max="100" step="0.1" inputmode="decimal"></label>
          <label class="f">גובה (ס״מ) <input id="hcm" type="number" min="2" max="100" step="0.1" inputmode="decimal"></label>
          <label class="f">DPI
            <select id="dpi"><option>150</option><option>200</option><option>300</option><option>400</option><option>600</option></select>
          </label>
        </div>
        <button class="link-btn" id="swap" type="button">⇄ החלפת רוחב/גובה</button>
      </details>
      <div class="msg" id="sizeMsg"></div>
    </div>
  </section>

  <section class="preview-col" aria-label="תצוגה מקדימה">
    <div class="card preview-card">
      <div class="seg" id="seg" data-v="design" role="tablist" aria-label="סוג תצוגה">
        <span class="ind" aria-hidden="true"></span>
        <button type="button" role="tab" data-v="design" aria-selected="true">העיצוב</button>
        <button type="button" role="tab" data-v="stone" aria-selected="false">על האבן</button>
      </div>
      <div class="stage" id="stage"><canvas id="preview" class="design" aria-label="תצוגה מקדימה"></canvas></div>
      <div class="meta">
        <div>
          <div class="dims" id="dims"></div>
          <div class="hint" id="hint"></div>
        </div>
        <button class="btn" id="saveDesktop" type="button"></button>
      </div>
    </div>
  </section>
</main>

<div class="savebar"><button class="btn" id="saveMobile" type="button"></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var STORE_KEY = 'stone-frame:v2';
  var STONE = [6, 6, 300];
  var PRESETS = [[10, 15], [13, 18], [15, 20], [20, 25], [21, 29.7], [30, 40]];
  var MAX_PIXELS = 16000000; // iOS Safari canvas area limit is ~16.7M px
  // Printable face of the stone inside stone.jpg (1024×1024), in image pixels.
  var FACE = { x: 236, y: 218, w: 553, h: 553, r: 46 };

  var state = {
    username: 'username', location: '', likes: '1,234', comments: '56', shares: '12', saves: '78',
    liked: true, wcm: STONE[0], hcm: STONE[1], dpi: STONE[2], img: null, avatar: null, zoom: 1, ox: 0, oy: 0,
    view: 'design'
  };

  // ---------- persistence ----------
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!s) return;
      ['username', 'location', 'likes', 'comments', 'shares', 'saves'].forEach(function (k) { if (typeof s[k] === 'string') state[k] = s[k]; });
      ['wcm', 'hcm', 'dpi'].forEach(function (k) { if (typeof s[k] === 'number' && s[k] > 0) state[k] = s[k]; });
      if (typeof s.liked === 'boolean') state.liked = s.liked;
      if (s.view === 'stone' || s.view === 'design') state.view = s.view;
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        username: state.username, location: state.location, likes: state.likes, comments: state.comments,
        shares: state.shares, saves: state.saves, liked: state.liked, wcm: state.wcm, hcm: state.hcm, dpi: state.dpi,
        view: state.view
      }));
    } catch (e) { /* storage unavailable */ }
  }

  // ---------- environment ----------
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isMobile = isIOS || /Android|Mobi/i.test(ua) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var canShareFiles = false;
  try {
    canShareFiles = !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] }));
  } catch (e) { canShareFiles = false; }
  var useShare = isMobile && canShareFiles;
  var saveLabel = useShare ? 'שמור תמונה' : 'הורד PNG';
  var ICON_DL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>';
  $('saveDesktop').innerHTML = ICON_DL + saveLabel;
  $('saveMobile').innerHTML = ICON_DL + saveLabel;

  // ---------- drawing ----------

  function showMsg(el, text, kind) { el.textContent = text || ''; el.className = 'msg' + (text ? ' show ' + (kind || 'info') : ''); }
  var tt = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('show'); }, 2600); }

  load();
  ['username', 'location', 'likes', 'comments', 'shares', 'saves'].forEach(function (k) { $(k).value = state[k]; });
  syncSize();
  syncLike(false);
  if (!isStoneSize()) $('more').open = true;
  setView(state.view, false);
  window.addEventListener('resize', schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreview);
  invalidate();
})();
</script>
</body>
</html>

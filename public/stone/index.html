<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f5f7">
<title>מסגרת פוסט להדפסה</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --line: #e3e5ea;
    --text: #15171c;
    --muted: #6b7080;
    --accent: #2f5bea;
    --accent-ink: #ffffff;
    --soft: #eef1fb;
    --danger: #c62f3b;
    --danger-bg: #fdeced;
    --ok: #1d7a4b;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --panel: #181b21; --line: #2a2e37; --text: #eef0f4;
      --muted: #9aa0ad; --accent: #6d8dff; --accent-ink: #0b0d12; --soft: #1e2433;
      --danger: #ff7a85; --danger-bg: #3a1c20; --ok: #5fd39a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Heebo", "Assistant", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header.top {
    max-width: 1180px; margin: 0 auto; padding: 28px 20px 8px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  header.top h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  header.top p { margin: 4px 0 0; color: var(--muted); }
  .layout {
    max-width: 1180px; margin: 0 auto; padding: 12px 20px 120px;
    display: grid; gap: 20px; grid-template-columns: 1fr;
  }
  @media (min-width: 920px) {
    .layout { grid-template-columns: 400px 1fr; align-items: start; padding-bottom: 40px; }
    .preview-col { position: sticky; top: 20px; }
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px;
  }
  .controls { display: grid; gap: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 650; color: var(--muted); letter-spacing: .02em; }
  label.f { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stack { display: grid; gap: 12px; }
  input[type=text], input[type=number], select {
    width: 100%; font: inherit; font-size: 16px; color: var(--text);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; outline: none; min-height: 44px;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  input.ltr { direction: ltr; text-align: right; }
  .drop {
    display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 12px;
    border: 1.5px dashed var(--line); background: var(--bg); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--soft); }
  .drop .thumb {
    width: 56px; height: 56px; border-radius: 10px; flex: none; background: var(--line) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted);
  }
  .drop b { display: block; font-weight: 600; }
  .drop span { color: var(--muted); font-size: 13px; }
  .row-mini { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .row-mini input[type=range] { flex: 1; accent-color: var(--accent); }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--danger-bg); color: var(--danger); }
  .msg.info { background: var(--soft); color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); min-height: 36px;
  }
  .chip-main {
    flex: 1 0 100%; display: grid; gap: 2px; text-align: right; padding: 10px 14px; border-radius: 12px; min-height: 56px;
  }
  .chip-main b { font-size: 15px; font-weight: 650; }
  .chip-main small { font-size: 12px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip-main[aria-pressed="true"] small { color: color-mix(in srgb, var(--accent-ink) 75%, transparent); }
  .link-btn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; }
  .preview-card { padding: 20px; }
  .stage {
    display: grid; place-items: center; min-height: 320px; height: min(72vh, 760px);
    background:
      repeating-conic-gradient(color-mix(in srgb, var(--line) 55%, transparent) 0 25%, transparent 0 50%) 0 0 / 20px 20px;
    border-radius: 12px; overflow: hidden;
  }
  @media (max-width: 919px) { .preview-col { order: -1; } .stage { height: auto; min-height: 0; padding: 14px; } }
  canvas#preview {
    display: block; background: #fff; border-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 18px 40px rgba(0,0,0,.14);
    max-width: 100%;
  }
  canvas#preview.can-drag { cursor: grab; touch-action: none; }
  canvas#preview.dragging { cursor: grabbing; }
  .meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .meta .dims { color: var(--muted); font-size: 13px; direction: rtl; }
  .meta .hint { color: var(--muted); font-size: 13px; }
  .btn {
    font: inherit; font-weight: 600; font-size: 16px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 12px 22px; min-height: 48px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn:not(:disabled):active { transform: translateY(1px); }
  .savebar { display: none; }
  @media (max-width: 919px) {
    .meta .btn { display: none; }
    .savebar {
      display: flex; gap: 10px; align-items: center; position: fixed; inset: auto 0 0 0; z-index: 10;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
    }
    .savebar .btn { flex: 1; }
    .savebar .dims { font-size: 12px; color: var(--muted); max-width: 40%; }
  }
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (min-width: 920px) { .toast { bottom: 28px; } }
  input[type=file]::file-selector-button {
    font: inherit; font-size: 13px; margin-inline-end: 10px; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer;
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>מסגרת פוסט להדפסה</h1>
    <p>מעלים תמונה, ממלאים פרטים ומורידים PNG בגודל הדפסה מדויק.</p>
  </div>
</header>

<main class="layout">
  <!-- Controls (right side in RTL) -->
  <section class="controls" aria-label="הגדרות">
    <div class="card">
      <h2>תמונה</h2>
      <label class="drop" id="drop">
        <div class="thumb" id="thumb" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
        </div>
        <div>
          <b id="dropTitle">בחרו תמונה מהגלריה</b>
          <span id="dropSub">JPG, PNG, HEIC — או גררו לכאן</span>
        </div>
        <input id="file" class="sr" type="file" accept="image/*">
      </label>
      <div class="row-mini" id="zoomRow" hidden>
        <span style="font-size:13px;color:var(--muted)">זום</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="זום">
        <button class="link-btn" id="resetPos" type="button">איפוס</button>
      </div>
      <div class="msg" id="imgMsg" role="alert"></div>
    </div>

    <div class="card">
      <h2>פרטי הפוסט</h2>
      <div class="stack">
        <label class="f">שם משתמש
          <input id="username" type="text" class="ltr" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="username">
        </label>
        <label class="f">מיקום
          <input id="location" type="text" dir="auto" autocomplete="off" placeholder="New York, NY">
        </label>
        <label class="f">תמונת פרופיל (לא חובה)
          <input id="avatarFile" type="file" accept="image/*" style="font-size:13px;padding:8px 0;border:0;background:none;min-height:0">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>מספרים</h2>
      <div class="grid2">
        <label class="f">לייקים <input id="likes" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">תגובות <input id="comments" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">שיתופים <input id="shares" type="text" inputmode="numeric" class="ltr"></label>
        <label class="f">שמירות <input id="saves" type="text" inputmode="numeric" class="ltr"></label>
      </div>
    </div>

    <div class="card">
      <h2>גודל הדפסה</h2>
      <div class="chips" id="presets"></div>
      <div class="grid3">
        <label class="f">רוחב (ס״מ) <input id="wcm" type="number" min="2" max="100" step="0.1" inputmode="decimal"></label>
        <label class="f">גובה (ס״מ) <input id="hcm" type="number" min="2" max="100" step="0.1" inputmode="decimal"></label>
        <label class="f">DPI
          <select id="dpi"><option>150</option><option>200</option><option>300</option><option>400</option><option>600</option></select>
        </label>
      </div>
      <div class="row-mini"><button class="link-btn" id="swap" type="button">⇄ החלפת רוחב/גובה</button></div>
      <div class="msg" id="sizeMsg"></div>
    </div>
  </section>

  <!-- Preview -->
  <section class="preview-col" aria-label="תצוגה מקדימה">
    <div class="card preview-card">
      <div class="stage" id="stage"><canvas id="preview" aria-label="תצוגה מקדימה של המסגרת"></canvas></div>
      <div class="meta">
        <div>
          <div class="dims" id="dims"></div>
          <div class="hint" id="hint"></div>
        </div>
        <button class="btn" id="saveDesktop" type="button"></button>
      </div>
    </div>
  </section>
</main>

<div class="savebar">
  <button class="btn" id="saveMobile" type="button"></button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var STORE_KEY = 'stone-frame:v2';
  var PRESETS = [[6, 6, 'גודל אבן', 300], [10, 15], [13, 18], [15, 20], [20, 25], [21, 29.7], [30, 40]];
  var MAX_PIXELS = 16000000; // iOS Safari canvas area limit is ~16.7M px

  var state = {
    username: 'username', location: '', likes: '1,234', comments: '56', shares: '12', saves: '78',
    wcm: 6, hcm: 6, dpi: 300, img: null, avatar: null, zoom: 1, ox: 0, oy: 0
  };

  // ---------- persistence ----------
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!s) return;
      ['username', 'location', 'likes', 'comments', 'shares', 'saves'].forEach(function (k) { if (typeof s[k] === 'string') state[k] = s[k]; });
      ['wcm', 'hcm', 'dpi'].forEach(function (k) { if (typeof s[k] === 'number' && s[k] > 0) state[k] = s[k]; });
    } catch (e) { /* storage unavailable */ }
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        username: state.username, location: state.location, likes: state.likes, comments: state.comments,
        shares: state.shares, saves: state.saves, wcm: state.wcm, hcm: state.hcm, dpi: state.dpi
      }));
    } catch (e) { /* storage unavailable */ }
  }

  // ---------- environment ----------
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isMobile = isIOS || /Android|Mobi/i.test(ua) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  var canShareFiles = false;
  try {
    canShareFiles = !!(navigator.canShare && navigator.share &&
      navigator.canShare({ files: [new File([new Blob(['x'], { type: 'image/png' })], 'x.png', { type: 'image/png' })] }));
  } catch (e) { canShareFiles = false; }
  var useShare = isMobile && canShareFiles;
  var saveLabel = useShare ? 'שמור תמונה' : 'הורד PNG';
  var ICON_DL = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>';
  $('saveDesktop').innerHTML = ICON_DL + saveLabel;
  $('saveMobile').innerHTML = ICON_DL + saveLabel;

  // ---------- drawing ----------
  var P = {
    heart: new Path2D('M12 20.3s-7.6-4.6-9.4-9.3C1.3 7.6 3.5 4.3 7 4.3c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 3.5 0 5.7 3.3 4.4 6.7-1.8 4.7-9.4 9.3-9.4 9.3z'),
    comment: new Path2D('M20.7 11.6a8.6 8.6 0 0 1-12.7 7.6L3 20.6l1.5-4.8a8.6 8.6 0 1 1 16.2-4.2z'),
    share: new Path2D('M21.5 3 2.8 9.4l7.4 3.3L13.6 21 21.5 3zM10.2 12.7 21.5 3'),
    save: new Path2D('M18.5 20.5 12 15.6l-6.5 4.9V4.8c0-.8.7-1.5 1.5-1.5h10c.8 0 1.5.7 1.5 1.5v15.7z')
  };
  var FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Heebo, Arial, sans-serif';

  function icon(ctx, path, x, y, size, lw) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(size / 24, size / 24);
    ctx.lineWidth = lw * 24 / size;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.stroke(path);
    ctx.restore();
  }

  function layout(W, H) {
    var u = W / 100;
    var header = 15 * u, footer = 14 * u;
    var imgH = Math.max(H - header - footer, 10 * u);
    return { u: u, header: header, footer: footer, ax: 0, ay: header, aw: W, ah: imgH };
  }

  function imageRect(L) {
    var img = state.img;
    var s = Math.max(L.aw / img.width, L.ah / img.height) * state.zoom;
    var w = img.width * s, h = img.height * s, dx = w - L.aw, dy = h - L.ah;
    return { x: L.ax - dx / 2 - state.ox * dx / 2, y: L.ay - dy / 2 - state.oy * dy / 2, w: w, h: h, dx: dx, dy: dy };
  }

  function render(ctx, W, H) {
    var L = layout(W, H), u = L.u, pad = 4 * u;
    ctx.save();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.direction = 'ltr'; // US Instagram layout: left to right

    // header: avatar + name on the left, dots on the right
    var r = 4.6 * u, cx = pad + r, cy = L.header / 2;
    var g = ctx.createLinearGradient(cx - r, cy + r, cx + r, cy - r);
    g.addColorStop(0, '#f9ce34'); g.addColorStop(.5, '#ee2a7b'); g.addColorStop(1, '#6228d7');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r - .55 * u, 0, Math.PI * 2); ctx.fill();
    var ir = r - 1.05 * u;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, ir, 0, Math.PI * 2); ctx.clip();
    if (state.avatar) {
      var a = state.avatar, as = Math.max(2 * ir / a.width, 2 * ir / a.height);
      ctx.drawImage(a, cx - a.width * as / 2, cy - a.height * as / 2, a.width * as, a.height * as);
    } else {
      ctx.fillStyle = '#e9ebef'; ctx.fillRect(cx - ir, cy - ir, 2 * ir, 2 * ir);
      ctx.fillStyle = '#9aa0ad';
      ctx.font = '600 ' + (ir * 1.05) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText((state.username.trim()[0] || '?').toUpperCase(), cx, cy + ir * .05);
    }
    ctx.restore();

    var tx = cx + r + 2.6 * u, maxText = W - tx - 12 * u;
    ctx.textAlign = 'left'; ctx.fillStyle = '#111';
    var name = state.username.trim() || 'username';
    if (state.location.trim()) {
      ctx.textBaseline = 'alphabetic';
      ctx.font = '600 ' + (3.6 * u) + 'px ' + FONT; ctx.fillText(name, tx, cy - .35 * u, maxText);
      ctx.font = (3.1 * u) + 'px ' + FONT; ctx.fillStyle = '#333'; ctx.fillText(state.location.trim(), tx, cy + 3.6 * u, maxText);
    } else {
      ctx.textBaseline = 'middle';
      ctx.font = '600 ' + (3.6 * u) + 'px ' + FONT; ctx.fillText(name, tx, cy, maxText);
    }
    ctx.fillStyle = '#111';
    for (var i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(W - pad - 1 * u - i * 2.4 * u, cy, .55 * u, 0, Math.PI * 2); ctx.fill(); }

    // image area
    ctx.save(); ctx.beginPath(); ctx.rect(L.ax, L.ay, L.aw, L.ah); ctx.clip();
    if (state.img) {
      var R = imageRect(L);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(state.img, R.x, R.y, R.w, R.h);
    } else {
      ctx.fillStyle = '#eef0f3'; ctx.fillRect(L.ax, L.ay, L.aw, L.ah);
      ctx.fillStyle = '#a3a8b4'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = (3.6 * u) + 'px ' + FONT; ctx.fillText('Your photo here', W / 2, L.ay + L.ah / 2);
    }
    ctx.restore();

    // footer: heart/comment/share on the left, save on the right, each with its count
    var fy = L.ay + L.ah + (L.footer - 6.6 * u) / 2, size = 6.6 * u, lw = .55 * u, ty = fy + size / 2 + .15 * u;
    ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
    ctx.font = '600 ' + (3.4 * u) + 'px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    var x = pad;
    [['heart', state.likes], ['comment', state.comments], ['share', state.shares]].forEach(function (it) {
      icon(ctx, P[it[0]], x, fy, size, lw);
      x += size + 1.4 * u;
      var t = it[1].trim();
      if (t) { ctx.fillText(t, x, ty); x += ctx.measureText(t).width; }
      x += 4 * u;
    });
    icon(ctx, P.save, W - pad - size, fy, size, lw);
    var sv = state.saves.trim();
    if (sv) { ctx.textAlign = 'right'; ctx.fillText(sv, W - pad - size - 1.4 * u, ty); }
    ctx.restore();
  }

  // ---------- preview ----------
  var cv = $('preview'), stage = $('stage'), view = { w: 0, h: 0 };
  function outPx() {
    var w = Math.round(state.wcm / 2.54 * state.dpi), h = Math.round(state.hcm / 2.54 * state.dpi);
    return { w: w, h: h };
  }
  function drawPreview() {
    var cs = getComputedStyle(stage);
    var bw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var bh = window.innerWidth >= 920 ? stage.clientHeight - 48 : Math.min(window.innerHeight * .62, 640);
    var ratio = state.wcm / state.hcm;
    var w = Math.min(bw - 8, bh * ratio), h = w / ratio;
    view.w = w; view.h = h;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    render(cv.getContext('2d'), cv.width, cv.height);

    var o = outPx();
    var txt = o.w + '×' + o.h + ' פיקסלים · ' + fmt(state.wcm) + '×' + fmt(state.hcm) + ' ס״מ · ' + state.dpi + ' DPI';
    $('dims').textContent = txt;
    $('hint').textContent = state.img ? 'גררו את התמונה כדי למקם אותה' : '';
    cv.classList.toggle('can-drag', !!state.img);
    var big = o.w * o.h > MAX_PIXELS;
    showMsg($('sizeMsg'), big ? 'הגודל גדול מדי לייצוא בדפדפן (' + Math.round(o.w * o.h / 1e6) + 'MP). הקטינו את ה-DPI או את המידות.' : '', 'err');
    $('saveDesktop').disabled = $('saveMobile').disabled = big;
  }
  function fmt(n) { return String(Math.round(n * 10) / 10); }

  var raf = 0;
  function update() { save(); invalidate(); if (!raf) raf = requestAnimationFrame(function () { raf = 0; drawPreview(); }); }

  // ---------- export ----------
  var CRC = (function () { var t = [], c; for (var n = 0; n < 256; n++) { c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { var c = 0xffffffff; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  // Adds a pHYs chunk so print software reads the right physical size.
  function withDpi(blob, dpi) {
    return blob.arrayBuffer().then(function (buf) {
      var src = new Uint8Array(buf), ppm = Math.round(dpi / 0.0254);
      var chunk = new Uint8Array(21), dv = new DataView(chunk.buffer);
      dv.setUint32(0, 9); chunk.set([112, 72, 89, 115], 4); // "pHYs"
      dv.setUint32(8, ppm); dv.setUint32(12, ppm); chunk[16] = 1;
      dv.setUint32(17, crc32(chunk.subarray(4, 17)));
      var out = new Uint8Array(src.length + 21);
      out.set(src.subarray(0, 33)); out.set(chunk, 33); out.set(src.subarray(33), 54);
      return new Blob([out], { type: 'image/png' });
    }).catch(function () { return blob; });
  }
  function fileName() {
    var n = (state.username.trim() || 'post').replace(/^@/, '').replace(/[\\/:*?"<>|\s]+/g, '_');
    return 'post-frame-' + n + '.png';
  }
  function makeBlob() {
    var o = outPx(), c = document.createElement('canvas');
    c.width = o.w; c.height = o.h;
    render(c.getContext('2d'), o.w, o.h);
    return new Promise(function (res, rej) {
      c.toBlob(function (b) { c.width = c.height = 0; b ? res(b) : rej(new Error('toBlob failed')); }, 'image/png');
    }).then(function (b) { return withDpi(b, state.dpi); });
  }

  // On iOS, share() must run while the tap still counts as a user gesture,
  // so the file is prepared ahead of time whenever the design changes.
  var ready = null, rev = 0, prepTimer = 0;
  function invalidate() {
    rev++; ready = null;
    if (!useShare) return;
    clearTimeout(prepTimer);
    prepTimer = setTimeout(prepare, 500);
  }
  function prepare() {
    var my = rev;
    if (outPx().w * outPx().h > MAX_PIXELS) return Promise.resolve(null);
    return makeBlob().then(function (b) {
      if (my !== rev) return null;
      ready = new File([b], fileName(), { type: 'image/png' });
      return ready;
    }).catch(function () { return null; });
  }
  function download(blob) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = fileName(); a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
  }
  function shareFile(file) {
    return navigator.share({ files: [file], title: file.name }).then(function () {
      toast('נשמר ✓');
    }, function (err) {
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'NotAllowedError') { toast('התמונה מוכנה — הקישו שוב על "שמור תמונה"'); return; }
      download(file); toast('הקובץ הורד');
    });
  }
  function onSave() {
    if (!state.img) toast('לא נבחרה תמונה — יוצא קובץ עם משטח ריק');
    if (useShare) {
      if (ready) { shareFile(ready); return; }
      busy(true);
      prepare().then(function (f) {
        busy(false);
        if (!f) { toast('הייצוא נכשל. נסו גודל קטן יותר.'); return; }
        shareFile(f);
      });
      return;
    }
    busy(true);
    makeBlob().then(function (b) { download(b); toast('הקובץ הורד ✓'); })
      .catch(function () { toast('הייצוא נכשל. נסו גודל קטן יותר.'); })
      .then(function () { busy(false); });
  }
  function busy(on) {
    ['saveDesktop', 'saveMobile'].forEach(function (id) {
      var b = $(id); b.disabled = on; b.innerHTML = on ? 'מכין קובץ…' : ICON_DL + saveLabel;
    });
  }
  $('saveDesktop').addEventListener('click', onSave);
  $('saveMobile').addEventListener('click', onSave);

  // ---------- images ----------
  function decode(file) {
    var url = URL.createObjectURL(file);
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () {
        (im.decode ? im.decode().catch(function () {}) : Promise.resolve()).then(function () { res({ img: im, url: url }); });
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('decode')); };
      im.src = url;
    });
  }
  function isHeic(file) { return /hei[cf]/i.test(file.type) || /\.(heic|heif)$/i.test(file.name || ''); }
  function errText(file) {
    return isHeic(file)
      ? 'הדפדפן הזה לא מצליח לפתוח קבצי HEIC. באייפון: פתחו את הדף ב-Safari ובחרו מהגלריה (Safari ממיר אוטומטית), או שמרו את התמונה כ-JPG ונסו שוב.'
      : 'לא הצלחנו לפתוח את הקובץ. נסו תמונה בפורמט JPG או PNG.';
  }
  var imgUrl = null;
  function setImage(file) {
    if (!file) return;
    showMsg($('imgMsg'), '');
    if (file.type && !/^image\//.test(file.type)) { showMsg($('imgMsg'), 'הקובץ שנבחר אינו תמונה.', 'err'); return; }
    $('dropTitle').textContent = 'טוען…';
    decode(file).then(function (r) {
      if (imgUrl) URL.revokeObjectURL(imgUrl);
      imgUrl = r.url;
      state.img = r.img; state.zoom = 1; state.ox = 0; state.oy = 0; $('zoom').value = 1;
      $('thumb').style.backgroundImage = 'url("' + r.url + '")'; $('thumb').innerHTML = '';
      $('dropTitle').textContent = 'החלפת תמונה';
      $('dropSub').textContent = (file.name || 'תמונה') + ' · ' + r.img.width + '×' + r.img.height;
      $('zoomRow').hidden = false;
      var o = outPx();
      if (r.img.width < o.w * .6 && r.img.height < o.h * .6) showMsg($('imgMsg'), 'שימו לב: הרזולוציה של התמונה נמוכה לגודל ההדפסה, ייתכן שהיא תיראה מטושטשת.', 'info');
      update();
    }, function () {
      $('dropTitle').textContent = state.img ? 'החלפת תמונה' : 'בחרו תמונה מהגלריה';
      showMsg($('imgMsg'), errText(file), 'err');
    });
  }
  $('file').addEventListener('change', function (e) { setImage(e.target.files[0]); e.target.value = ''; });
  var drop = $('drop');
  ['dragenter', 'dragover'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (t) { drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { setImage(e.dataTransfer && e.dataTransfer.files[0]); });

  $('avatarFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    decode(f).then(function (r) { state.avatar = r.img; update(); }, function () { toast(errText(f)); });
  });

  // ---------- pan & zoom ----------
  var drag = null;
  cv.addEventListener('pointerdown', function (e) {
    if (!state.img) return;
    drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var L = layout(view.w, view.h), R = imageRect(L);
    var mx = e.clientX - drag.x, my = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (R.dx > 0.5) state.ox = clamp(state.ox - 2 * mx / R.dx, -1, 1);
    if (R.dy > 0.5) state.oy = clamp(state.oy - 2 * my / R.dy, -1, 1);
    update();
  });
  function endDrag() { drag = null; cv.classList.remove('dragging'); }
  cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
  $('zoom').addEventListener('input', function (e) { state.zoom = +e.target.value; update(); });
  $('resetPos').addEventListener('click', function () { state.zoom = 1; state.ox = state.oy = 0; $('zoom').value = 1; update(); });
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  // ---------- form ----------
  ['username', 'location', 'likes', 'comments', 'shares', 'saves'].forEach(function (k) {
    var el = $(k); el.value = state[k];
    el.addEventListener('input', function () { state[k] = el.value; update(); });
  });
  function syncSize() {
    $('wcm').value = fmt(state.wcm); $('hcm').value = fmt(state.hcm);
    var dpiSel = $('dpi');
    if (![].some.call(dpiSel.options, function (o) { return +o.value === state.dpi; })) dpiSel.add(new Option(String(state.dpi)));
    dpiSel.value = String(state.dpi);
    [].forEach.call($('presets').children, function (b) {
      var p = b._p, on = (p[0] === state.wcm && p[1] === state.hcm) || (p[1] === state.wcm && p[0] === state.hcm);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b._p = p;
    if (p[2]) {
      b.className = 'chip chip-main';
      b.innerHTML = '<b></b><small></small>';
      b.firstChild.textContent = p[2];
      b.lastChild.textContent = fmt(p[0]) + '×' + fmt(p[1]) + ' ס״מ';
    } else b.textContent = p[0] === 21 ? 'A4' : fmt(p[0]) + '×' + fmt(p[1]);
    b.addEventListener('click', function () {
      if (p[3]) state.dpi = p[3];
      var landscape = state.wcm > state.hcm;
      state.wcm = landscape ? p[1] : p[0]; state.hcm = landscape ? p[0] : p[1];
      syncSize(); update();
    });
    $('presets').appendChild(b);
  });
  ['wcm', 'hcm'].forEach(function (k) {
    $(k).addEventListener('input', function () {
      var v = parseFloat($(k).value);
      if (v >= 2 && v <= 100) { state[k] = v; syncSize2(); update(); }
    });
    $(k).addEventListener('blur', syncSize);
  });
  function syncSize2() { // keep the typed field untouched, refresh chips only
    [].forEach.call($('presets').children, function (b) {
      var p = b._p, on = (p[0] === state.wcm && p[1] === state.hcm) || (p[1] === state.wcm && p[0] === state.hcm);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  $('dpi').addEventListener('change', function () { state.dpi = +$('dpi').value; update(); });
  $('swap').addEventListener('click', function () { var t = state.wcm; state.wcm = state.hcm; state.hcm = t; syncSize(); update(); });

  // ---------- ui helpers ----------
  function showMsg(el, text, kind) { el.textContent = text || ''; el.className = 'msg' + (text ? ' show ' + (kind || 'info') : ''); }
  var tt = 0;
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('show'); }, 2600); }

  load();
  ['username', 'location', 'likes', 'comments', 'shares', 'saves'].forEach(function (k) { $(k).value = state[k]; });
  syncSize();
  window.addEventListener('resize', function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; drawPreview(); }); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPreview);
  drawPreview();
  invalidate();
})();
</script>
</body>
</html>

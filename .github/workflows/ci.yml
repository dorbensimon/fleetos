name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: |
          # company-signing-template maps pdf-lib in its own deno.json, so it is checked with that config.
          deno check --no-config --lock=supabase/functions/deno.lock --frozen $(ls supabase/functions/*/index.ts | grep -v company-signing-template)
          deno check --config supabase/functions/company-signing-template/deno.json --frozen supabase/functions/company-signing-template/index.ts
